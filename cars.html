<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cars</title>
<meta name="theme-color" content="#8fd3ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toddler Games">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --ink: #2b2b3a;
    --road: #454552;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; background: #bfe6ff; overflow: hidden; }
  body {
    font-family: "Baloo 2", ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  .deck {
    display: flex; height: 100%; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch;
    scroll-behavior: smooth;
  }
  .deck::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .sun { position: absolute; top: 9%; right: 8%; width: 16vmin; height: 16vmin; border-radius: 50%; background: rgba(255,255,255,.55); }
  .road { position: absolute; left: 0; right: 0; bottom: 0; height: 32%; background: var(--road); }
  .road::before {
    content: ""; position: absolute; left: 0; right: 0; top: 55%; height: 5px;
    background: repeating-linear-gradient(90deg, #fff 0 36px, transparent 36px 72px); opacity: .75;
  }
  .vehicle { width: min(98vw, 110vh); position: relative; z-index: 2; margin-top: 6vh; }
  .vehicle svg { width: 100%; height: auto; display: block; overflow: visible; }
  .slide.enter .vehicle { animation: drive .6s cubic-bezier(.2,.9,.3,1.08) both; }
  .vehicle.bounce { animation: bounce .55s ease; }
  @keyframes drive { from { transform: translateX(-80vw); } to { transform: translateX(0); } }
  @keyframes bounce {
    0% { transform: scale(1); } 25% { transform: scale(1.08, .93) rotate(-1.5deg); }
    55% { transform: scale(.97, 1.05) rotate(1.5deg); } 100% { transform: scale(1); }
  }
  .tag { position: relative; z-index: 3; display: flex; align-items: center; gap: 14px; margin-top: 3vh; padding: 0 14px; }
  .tag .badge { flex: 0 0 auto; width: clamp(48px, 15vw, 84px); }
  .tag .badge svg { width: 100%; height: auto; display: block; }
  .name {
    margin: 0; font-size: clamp(34px, 10.5vw, 72px); font-weight: 800; color: #fff; line-height: 1;
    text-shadow: 0 4px 0 rgba(0,0,0,.25);
  }
  .wheel { transform-box: fill-box; transform-origin: center; }
  .slide.enter .wheel { animation: spin .6s linear 1; }
  @keyframes spin { to { transform: rotate(-720deg); } }
  .photo { background: #111; }
  .photo img { width: 100%; height: 100%; object-fit: contain; display: block; }
  .hint {
    position: absolute; right: 16px; top: 42%; z-index: 4; font-size: 54px; color: rgba(255,255,255,.95);
    text-shadow: 0 3px 0 rgba(0,0,0,.25); animation: nudge 1.2s ease-in-out infinite; pointer-events: none;
  }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
  .dots {
    position: fixed; left: 72px; right: 72px; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 10;
    display: flex; gap: 7px; justify-content: center; pointer-events: none; flex-wrap: wrap;
  }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.55); transition: transform .2s, background .2s; }
  .dots i.on { background: #fff; transform: scale(1.5); }
  #panel {
    position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
    background: rgba(20,20,30,.6); padding: 24px;
  }
  #panel.open { display: flex; }
  #panel .box { background: #fff; color: var(--ink); border-radius: 22px; padding: 22px; width: min(92vw, 380px); text-align: center; }
  #panel h2 { margin: 0 0 6px; font-size: 26px; }
  #panel p { margin: 0 0 16px; font-size: 16px; line-height: 1.3; font-weight: 700; opacity: .75; }
  #panel button {
    display: block; width: 100%; margin-top: 10px; padding: 14px; border: 0; border-radius: 14px;
    font: inherit; font-size: 20px; font-weight: 800; background: #2f8cf0; color: #fff;
  }
  #panel button.alt { background: #e9ebf0; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) {
    .slide.enter .vehicle, .slide.enter .wheel, .hint, .vehicle.bounce { animation: none; }
  }
</style>
</head>
<body>
<div class="dots" id="dots"></div>
<div id="panel"><div class="box">
  <h2>Parent corner</h2>
  <p>Add real photos from your phone. They show first and stay saved on this device.</p>
  <button id="addBtn">Add photos</button>
  <button id="clearBtn" class="alt">Remove my photos</button>
  <button id="closeBtn" class="alt">Close</button>
</div></div>
<input id="file" type="file" accept="image/*" multiple hidden>
<main class="deck" id="deck"></main>

<script src="shared.js"></script>
<script>
// ---------- realistic-style side-view car kit (viewBox 320 x 160) ----------
let uid = 0;
function rim(cx, cy, r) {
  let sp = '';
  for (let i = 0; i < 5; i++) {
    const a = (i * 72 - 90) * Math.PI / 180;
    sp += `<line x1="${cx}" y1="${cy}" x2="${(cx + Math.cos(a) * r * 0.66).toFixed(1)}" y2="${(cy + Math.sin(a) * r * 0.66).toFixed(1)}" stroke="#6d7480" stroke-width="3.2" stroke-linecap="round"/>`;
  }
  return `<g class="wheel"><circle cx="${cx}" cy="${cy}" r="${r}" fill="#17171d"/>
  <circle cx="${cx}" cy="${cy}" r="${r * 0.68}" fill="#dfe3ea"/>
  <circle cx="${cx}" cy="${cy}" r="${r * 0.52}" fill="#bfc5cf"/>${sp}
  <circle cx="${cx}" cy="${cy}" r="${r * 0.13}" fill="#3b3f48"/></g>`;
}
function build(o) {
  const id = 'c' + (uid++);
  const wells = o.wheels.map(([x, y, r]) => `<circle cx="${x}" cy="${y}" r="${r + 6}" fill="#101017"/>`).join('');
  const rims = o.wheels.map(([x, y, r]) => rim(x, y, r)).join('');
  const flares = o.flare ? o.wheels.map(([x, y, r]) => `<path d="M${x - r - 10} ${y - 2} A${r + 10} ${r + 10} 0 0 1 ${x + r + 10} ${y - 2}" fill="none" stroke="#262630" stroke-width="6"/>`).join('') : '';
  const pillars = (o.pillars || []).map(([x, y1, y2]) => `<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${o.color}" stroke-width="7"/>`).join('');
  const handles = (o.handles || []).map(([x, y]) => `<rect x="${x}" y="${y}" width="15" height="4" rx="2" fill="#000" opacity=".35"/>`).join('');
  return `<svg viewBox="0 0 320 160" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sh${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity=".5"/><stop offset=".42" stop-color="#fff" stop-opacity="0"/>
      <stop offset="1" stop-color="#000" stop-opacity=".32"/></linearGradient>
    <linearGradient id="gl${id}" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9d7f2"/><stop offset="1" stop-color="#2b4058"/></linearGradient>
    <clipPath id="cp${id}"><path d="${o.body}"/></clipPath>
  </defs>
  <ellipse cx="160" cy="143" rx="146" ry="6" fill="#000" opacity=".28"/>
  ${o.pre || ''}
  <path d="${o.body}" fill="${o.color}" stroke="rgba(0,0,0,.28)" stroke-width="1.6" stroke-linejoin="round"/>
  <g clip-path="url(#cp${id})">${wells}</g>
  <path d="${o.glass}" fill="url(#gl${id})"/>
  <path d="${o.glass}" fill="none" stroke="rgba(0,0,0,.35)" stroke-width="1.5"/>
  ${pillars}
  <path d="${o.doors}" stroke="rgba(0,0,0,.28)" stroke-width="1.6" fill="none"/>
  ${handles}
  <path d="${o.body}" fill="url(#sh${id})"/>
  <path d="${o.head}" fill="#fff6c4" stroke="rgba(0,0,0,.4)" stroke-width="1.2"/>
  <path d="${o.tail}" fill="#e5322d" stroke="rgba(0,0,0,.4)" stroke-width="1.2"/>
  ${o.extra || ''}${flares}${rims}
  </svg>`;
}

const SEDAN = {
  body: 'M10 114 L12 96 Q14 88 38 84 L96 78 Q118 52 150 48 L206 48 Q238 50 254 74 L292 82 Q310 86 310 100 L310 114Z',
  glass: 'M108 76 Q124 56 152 54 L204 54 Q228 56 242 76Z', pillars: [[178, 54, 76]],
  doors: 'M178 76 V110 M118 80 L114 110 M240 78 L244 108', handles: [[148, 84], [198, 84]],
  head: 'M290 88 L308 92 L306 99 L288 96Z', tail: 'M12 92 L28 90 L28 99 L12 101Z',
  extra: '<rect x="236" y="76" width="12" height="6" rx="3" fill="#000" opacity=".4"/>',
  wheels: [[84, 116, 23], [238, 116, 23]]
};
const COUPE = {
  body: 'M10 114 L12 98 Q14 90 36 86 L98 80 Q136 54 176 52 Q214 52 236 74 L288 84 Q310 90 310 102 L310 114Z',
  glass: 'M120 78 Q146 58 176 58 Q204 60 224 76Z', pillars: [[170, 58, 77]],
  doors: 'M170 77 V110 M236 76 L240 108', handles: [[142, 86]],
  head: 'M292 90 L310 96 L306 101 L290 97Z', tail: 'M12 96 L30 92 L30 99 L12 103Z',
  extra: '<rect x="12" y="86" width="30" height="5" rx="2" fill="#000" opacity=".35"/>',
  wheels: [[80, 117, 24], [238, 117, 24]]
};
const SUV = {
  body: 'M10 116 L12 86 Q14 78 30 76 L52 54 Q58 48 72 48 L222 48 Q240 48 252 64 L286 80 Q308 86 310 100 L310 116Z',
  glass: 'M62 74 L74 56 L216 56 Q232 58 242 74Z', pillars: [[120, 56, 74], [182, 56, 74]],
  doors: 'M120 74 V112 M182 74 V112 M240 76 L244 110', handles: [[96, 82], [150, 82], [204, 82]],
  head: 'M292 88 L310 94 L308 101 L290 97Z', tail: 'M12 88 L24 86 L24 102 L12 104Z',
  extra: '<path d="M70 46 H224" stroke="#1c1c22" stroke-width="3" stroke-linecap="round"/>',
  wheels: [[82, 117, 26], [238, 117, 26]]
};
const BOXY = {   // G-Class
  body: 'M12 114 V76 Q12 70 20 70 H42 L52 36 H236 L254 70 H298 Q310 70 310 82 V114Z',
  glass: 'M60 70 L66 42 H234 L248 70Z', pillars: [[120, 42, 70], [186, 42, 70]],
  doors: 'M120 70 V112 M186 70 V112 M240 72 V112', handles: [[98, 84], [158, 84], [210, 84]],
  head: 'M292 76 a8 8 0 1 0 0.1 0Z', tail: 'M14 98 H24 V106 H14Z',
  extra: '<circle cx="8" cy="88" r="17" fill="#17171d"/><circle cx="8" cy="88" r="8" fill="#bfc5cf"/><ellipse cx="268" cy="80" rx="6" ry="3" fill="#ffb000"/>',
  wheels: [[84, 117, 25], [238, 117, 25]], flare: true
};
const WRANG = {  // Jeep Wrangler
  body: 'M12 114 V80 Q12 74 20 74 H60 L66 46 H214 L238 74 H300 Q310 74 310 84 V114Z',
  glass: 'M72 70 L76 52 H208 L226 70Z', pillars: [[142, 52, 70]],
  doors: 'M142 72 V112 M216 76 V112', handles: [[116, 84], [168, 84]],
  head: 'M294 86 a8 8 0 1 0 0.1 0Z', tail: 'M14 96 H24 V104 H14Z',
  extra: '<path d="M226 70 L208 50" stroke="#1c1c22" stroke-width="4" stroke-linecap="round"/><path d="M62 48 H216" stroke="#1c1c22" stroke-width="5" stroke-linecap="round"/><ellipse cx="8" cy="92" rx="10" ry="20" fill="#17171d"/><path d="M84 112 H226" stroke="#1c1c22" stroke-width="5" stroke-linecap="round"/>',
  wheels: [[84, 116, 27], [242, 116, 27]], flare: true
};
const PICK = {   // Jeep Gladiator
  body: 'M12 114 V80 H112 V76 H126 L132 46 H214 L238 74 H300 Q310 74 310 84 V114Z',
  glass: 'M136 70 L140 52 H210 L228 70Z', pillars: [[176, 52, 70]],
  doors: 'M176 72 V112 M218 76 V112', handles: [[152, 84]],
  head: 'M294 86 a8 8 0 1 0 0.1 0Z', tail: 'M12 82 H20 V92 H12Z',
  extra: '<rect x="14" y="80" width="96" height="9" fill="#101017" opacity=".55"/><path d="M228 70 L210 50" stroke="#1c1c22" stroke-width="4" stroke-linecap="round"/><path d="M130 48 H214" stroke="#1c1c22" stroke-width="5" stroke-linecap="round"/>',
  wheels: [[66, 116, 27], [244, 116, 27]], flare: true
};
const GT = {     // low sports coupe
  body: 'M10 114 L12 102 Q14 94 40 90 L110 84 Q150 58 188 56 Q220 58 236 78 L290 86 Q312 92 312 104 L312 114Z',
  glass: 'M130 82 Q156 62 188 62 Q210 64 224 80Z', pillars: [],
  doors: 'M178 84 V110 M238 80 L242 108', handles: [[148, 90]],
  head: 'M294 94 L312 100 L308 105 L292 101Z', tail: 'M12 100 L30 96 L30 103 L12 107Z',
  extra: '<rect x="12" y="86" width="30" height="5" rx="2" fill="#000" opacity=".4"/>',
  wheels: [[82, 117, 25], [242, 117, 25]]
};

// ---------- brand badges ----------
const BADGE = {
  jeep: `<svg viewBox="0 0 120 40"><rect width="120" height="40" rx="9" fill="#2b2b3a"/><text x="60" y="30" text-anchor="middle" font-family="Arial Black, Arial, sans-serif" font-weight="900" font-size="27" letter-spacing="3" fill="#fff">JEEP</text></svg>`,
  merc: `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="27" fill="#eef1f5" stroke="#8c95a1" stroke-width="3"/><circle cx="30" cy="30" r="22" fill="none" stroke="#8c95a1" stroke-width="1.5"/><path d="M30 30 L30 9 M30 30 L48.2 40.5 M30 30 L11.8 40.5" stroke="#5f6874" stroke-width="3.4" stroke-linecap="round" fill="none"/></svg>`,
  bmw: `<svg viewBox="0 0 60 60"><circle cx="30" cy="30" r="28" fill="#1a1a1f"/><circle cx="30" cy="30" r="22" fill="#fff"/><path d="M30 30 L30 8 A22 22 0 0 0 8 30Z" fill="#2f7cd8"/><path d="M30 30 L52 30 A22 22 0 0 1 30 52Z" fill="#2f7cd8"/></svg>`
};

const vehicles = [
  { name: 'Jeep Wrangler',      say: 'Jeep Wrangler',      brand: 'jeep', spec: WRANG, color: '#ffc928', eng: 'eng_diesel', bg: '#8fd3ff' },
  { name: 'Mercedes G-Class',   say: 'Mercedes G Class',   brand: 'merc', spec: BOXY,  color: '#262a33', eng: 'eng_car2', bg: '#ffd89a' },
  { name: 'BMW M4',             say: 'B M W M four',       brand: 'bmw',  spec: COUPE, color: '#1fa36b', eng: 'eng_cobra', bg: '#ffe0e8' },
  { name: 'Mercedes C-Class',   say: 'Mercedes C Class',   brand: 'merc', spec: SEDAN, color: '#b6bdc8', eng: 'eng_car2', bg: '#c6e3ff' },
  { name: 'Jeep Gladiator',     say: 'Jeep Gladiator',     brand: 'jeep', spec: PICK,  color: '#ff7a1a', eng: 'eng_diesel', bg: '#c4f0d2' },
  { name: 'BMW X5',             say: 'B M W X five',       brand: 'bmw',  spec: SUV,   color: '#f4f6f9', eng: 'eng_car2', bg: '#b9c6ff' },
  { name: 'Mercedes AMG GT',    say: 'Mercedes A M G G T', brand: 'merc', spec: GT,    color: '#e23a3a', eng: 'eng_aston', bg: '#fff0a8' },
  { name: 'Jeep Grand Cherokee',say: 'Jeep Grand Cherokee',brand: 'jeep', spec: SUV,   color: '#2f6a50', eng: 'eng_diesel', bg: '#ffd1b3' },
  { name: 'BMW 3 Series',       say: 'B M W three series', brand: 'bmw',  spec: SEDAN, color: '#2b6cd8', eng: 'eng_car2', bg: '#d9f0b8' },
  { name: 'Jeep Wrangler',      say: 'Jeep Wrangler',      brand: 'jeep', spec: WRANG, color: '#e5392c', eng: 'eng_diesel', bg: '#cdbdff' },
].map(v => ({ ...v, svg: build({ ...v.spec, color: v.color }) }));

// ---------- photos saved on this phone (optional) ----------
function idb() {
  return new Promise((res, rej) => {
    const r = indexedDB.open('vroom', 1);
    r.onupgradeneeded = () => r.result.createObjectStore('kv');
    r.onsuccess = () => res(r.result); r.onerror = () => rej(r.error);
  });
}
async function loadPhotos() {
  try {
    const db = await idb();
    return await new Promise(res => {
      const q = db.transaction('kv').objectStore('kv').get('photos');
      q.onsuccess = () => res(q.result || []); q.onerror = () => res([]);
    });
  } catch (e) { return []; }
}
async function savePhotos(list) {
  try { const db = await idb(); db.transaction('kv', 'readwrite').objectStore('kv').put(list, 'photos'); } catch (e) {}
}
function fileToDataURL(f) {
  return new Promise(res => {
    const rd = new FileReader();
    rd.onerror = () => res(null);
    rd.onload = () => {
      const img = new Image();
      img.onerror = () => res(null);
      img.onload = () => {
        const s = Math.min(1, 1400 / Math.max(img.width, img.height));
        const c = document.createElement('canvas');
        c.width = Math.round(img.width * s); c.height = Math.round(img.height * s);
        c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
        res(c.toDataURL('image/jpeg', 0.85));
      };
      img.src = rd.result;
    };
    rd.readAsDataURL(f);
  });
}

// ---------- build the deck ----------
TG.preload([...new Set(vehicles.map(v => v.eng)), 'horn1', 'horn2', 'horn3', 'truckhorn']);
const deck = document.getElementById('deck');
const dotsEl = document.getElementById('dots');
let photos = [];
let slides = [], dots = [], current = -1, io = null;

function render() {
  if (io) io.disconnect();
  deck.innerHTML = ''; dotsEl.innerHTML = '';
  const items = [
    ...photos.map(src => ({ photo: src })),
    ...vehicles
  ];
  items.forEach((v, i) => {
    const s = document.createElement('section');
    if (v.photo) {
      s.className = 'slide photo';
      s.innerHTML = `<img alt="" src="${v.photo}">`;
    } else {
      s.className = 'slide';
      s.style.background = v.bg;
      s.innerHTML = `<div class="sun"></div><div class="road"></div>
        <div class="vehicle" role="button" aria-label="${v.name}">${v.svg}</div>
        <div class="tag"><div class="badge">${BADGE[v.brand]}</div><h1 class="name">${v.name}</h1></div>`;
      const veh = s.querySelector('.vehicle');
      const horns = ['horn1', 'horn2', 'horn3', 'truckhorn'];
      let taps = 0, said = false;
      veh.addEventListener('pointerdown', e => {
        const honk = taps++ % 2 === 1;
        TG.play(honk ? horns[Math.floor(Math.random() * horns.length)] : v.eng);
        veh.classList.remove('bounce'); void veh.offsetWidth; veh.classList.add('bounce');
        const r = veh.getBoundingClientRect();
        if (honk) {
          TG.pulse(veh, 3);
          TG.burst(e.clientX, e.clientY, ['🎵', '📣', '⭐', '✨'], 9);
        } else {
          TG.burst(r.left + r.width * 0.05, r.top + r.height * 0.7, ['💨', '☁️', '💨', '🔥'], 8);
          TG.burst(e.clientX, e.clientY, ['⭐', '✨'], 4);
        }
        if (!said) { said = true; setTimeout(() => TG.speak(v.say), 1300); }
      });
      veh.addEventListener('animationend', e => { if (e.animationName === 'bounce') veh.classList.remove('bounce'); });
    }
    if (i === 0) s.insertAdjacentHTML('beforeend', '<div class="hint" aria-hidden="true">&#10140;</div>');
    deck.appendChild(s);
    dotsEl.appendChild(document.createElement('i'));
  });
  slides = [...deck.children]; dots = [...dotsEl.children]; current = -1;
  deck.scrollTo({ left: 0, behavior: 'auto' });
  io = new IntersectionObserver(entries => {
    entries.forEach(en => {
      const i = slides.indexOf(en.target);
      if (en.isIntersecting && en.intersectionRatio > 0.6 && i !== current) {
        current = i;
        dots.forEach((d, k) => d.classList.toggle('on', k === i));
        slides.forEach(s => s.classList.remove('enter'));
        void en.target.offsetWidth;
        en.target.classList.add('enter');
        const h = deck.querySelector('.hint'); if (h && i > 0) h.remove();
      }
    });
  }, { root: deck, threshold: [0.6] });
  slides.forEach(s => io.observe(s));
}

// ---------- home + parent corner (press and hold) ----------
const panel = document.getElementById('panel');
const fileIn = document.getElementById('file');
TG.holdButton({ emoji: '🏠', side: 'left', label: 'Home (press and hold)', hint: 'Hold to go home', onDone: () => { location.href = 'index.html'; } });
TG.holdButton({ emoji: '📷', side: 'right', small: true, ms: 900, label: 'Add photos (press and hold)', hint: 'Hold for parents', onDone: () => panel.classList.add('open') });
document.getElementById('closeBtn').onclick = () => panel.classList.remove('open');
document.getElementById('addBtn').onclick = () => fileIn.click();
document.getElementById('clearBtn').onclick = async () => { photos = []; await savePhotos([]); panel.classList.remove('open'); render(); };
fileIn.addEventListener('change', async () => {
  const files = [...fileIn.files];
  const added = [];
  for (const f of files) { const d = await fileToDataURL(f); if (d) added.push(d); }
  fileIn.value = '';
  if (added.length) { photos = [...added, ...photos]; await savePhotos(photos); panel.classList.remove('open'); render(); }
});

render();
loadPhotos().then(p => { if (p.length) { photos = p; render(); } });
TG.registerSW();
</script>
</body>
</html>
