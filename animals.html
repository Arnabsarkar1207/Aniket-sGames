<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --ink: #2b2b3a;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; background: #c9ecff; overflow: hidden; }
  body {
    font-family: "Baloo 2", ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  .deck {
    display: flex; height: 100%; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
  }
  .deck::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .sun { position: absolute; top: 9%; right: 8%; width: 16vmin; height: 16vmin; border-radius: 50%; background: rgba(255,255,255,.6); }
  .hill {
    position: absolute; left: -15%; right: -15%; bottom: -14%; height: 36%;
    border-radius: 50% 50% 0 0; background: #7fd07a;
  }
  .hill::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 0; border-radius: inherit;
    background: radial-gradient(ellipse at 30% 0%, rgba(255,255,255,.25), transparent 60%);
  }
  .animal { position: relative; z-index: 2; width: min(80vw, 54vh); margin-top: 4vh; cursor: pointer; }
  .animal svg { width: 100%; height: auto; display: block; overflow: visible; }
  .slide.enter .animal { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; }
  .animal.wiggle { animation: wiggle .6s ease; }
  @keyframes pop { from { transform: scale(.55) translateY(8vh); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes wiggle {
    0% { transform: rotate(0) scale(1); } 20% { transform: rotate(-5deg) scale(1.06); }
    45% { transform: rotate(5deg) scale(1.06); } 70% { transform: rotate(-3deg) scale(1.03); } 100% { transform: rotate(0) scale(1); }
  }
  .bubble {
    position: absolute; right: -6%; top: -6%; z-index: 5; background: #fff; color: var(--ink);
    font-weight: 800; font-size: clamp(26px, 8vw, 46px); line-height: 1; padding: 10px 18px; border-radius: 26px;
    box-shadow: 0 5px 0 rgba(0,0,0,.15); opacity: 0; transform: scale(.4); pointer-events: none; white-space: nowrap;
  }
  .bubble::after {
    content: ""; position: absolute; left: 22px; bottom: -12px; border: 10px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  .bubble.show { animation: bub 1.6s ease both; }
  @keyframes bub {
    0% { opacity: 0; transform: scale(.4) rotate(-6deg); } 15% { opacity: 1; transform: scale(1.1) rotate(3deg); }
    30% { transform: scale(1) rotate(0); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.9); }
  }
  .name {
    position: relative; z-index: 3; margin: 2vh 0 0; font-size: clamp(48px, 15vw, 100px); font-weight: 800; color: #fff;
    line-height: 1; text-shadow: 0 5px 0 rgba(0,0,0,.22); text-align: center;
  }
  .hint {
    position: absolute; right: 16px; top: 44%; z-index: 4; font-size: 54px; color: rgba(255,255,255,.95);
    text-shadow: 0 3px 0 rgba(0,0,0,.25); animation: nudge 1.2s ease-in-out infinite; pointer-events: none;
  }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
  .dots {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 10;
    display: flex; gap: 7px; justify-content: center; pointer-events: none;
  }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.6); transition: transform .2s, background .2s; }
  .dots i.on { background: #fff; transform: scale(1.5); }
  #parent {
    position: fixed; right: 8px; top: calc(env(safe-area-inset-top, 0px) + 4px); z-index: 20;
    width: 30px; height: 30px; border-radius: 50%; border: 0; padding: 0; font-size: 14px;
    background: rgba(255,255,255,.35); opacity: .6;
  }
  #panel {
    position: fixed; inset: 0; z-index: 30; display: none; align-items: center; justify-content: center;
    background: rgba(20,20,30,.6); padding: 24px;
  }
  #panel.open { display: flex; }
  #panel .box { background: #fff; color: var(--ink); border-radius: 22px; padding: 22px; width: min(92vw, 380px); text-align: center; }
  #panel h2 { margin: 0 0 12px; font-size: 26px; }
  #panel button {
    display: block; width: 100%; margin-top: 10px; padding: 14px; border: 0; border-radius: 14px;
    font: inherit; font-size: 20px; font-weight: 800; background: #2f8cf0; color: #fff;
  }
  #panel button.alt { background: #e9ebf0; color: var(--ink); }
  @media (prefers-reduced-motion: reduce) {
    .slide.enter .animal, .animal.wiggle, .hint { animation: none; }
  }
</style>
</head>

  return `<circle cx="${x}" cy="${y}" r="${r}" fill="#222"/><circle cx="${x + r * .35}" cy="${y - r * .35}" r="${r * .32}" fill="#fff"/>`;
}
function scallops(cx, cy, R, r, n, fill, stroke) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = i * 2 * Math.PI / n;
    s += `<circle cx="${(cx + Math.cos(a) * R).toFixed(1)}" cy="${(cy + Math.sin(a) * R).toFixed(1)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`;
  }
  return s;
}

// ---------- synthesized sounds (Web Audio, no files needed) ----------
let ac = null, master = null;
function audio() {
  if (!ac) {
    const AC = window.AudioContext || window.webkitAudioContext;
    ac = new AC();
    const comp = ac.createDynamicsCompressor();
    master = ac.createGain(); master.gain.value = 0.9;
    master.connect(comp); comp.connect(ac.destination);
  }
  if (ac.state === 'suspended') ac.resume();
  return ac;
}
function chain(src, filters) {
  let node = src;
  (filters || []).forEach(([type, f, q]) => {
    const b = ac.createBiquadFilter(); b.type = type; b.frequency.value = f; b.Q.value = q || 1;
    node.connect(b); node = b;
  });
  return node;
}
function shape(node, t0, dur, vol, a, r) {
  const g = ac.createGain();
  g.gain.setValueAtTime(0, t0);
  g.gain.linearRampToValueAtTime(vol, t0 + a);
  g.gain.setValueAtTime(vol, Math.max(t0 + a, t0 + dur - r));
  g.gain.linearRampToValueAtTime(0, t0 + dur);
  node.connect(g); g.connect(master);
}
function tone(o) {
  const t0 = ac.currentTime + (o.at || 0), dur = o.dur;
  const osc = ac.createOscillator(); osc.type = o.type || 'sawtooth';
  const p = o.pts;
  osc.frequency.setValueAtTime(p[0][1], t0 + p[0][0]);
  for (let i = 1; i < p.length; i++) osc.frequency.linearRampToValueAtTime(p[i][1], t0 + p[i][0]);
  if (o.vib) {
    const l = ac.createOscillator(), lg = ac.createGain();
    l.frequency.value = o.vib[0]; lg.gain.value = o.vib[1];
    l.connect(lg); lg.connect(osc.frequency); l.start(t0); l.stop(t0 + dur + 0.1);
  }
  shape(chain(osc, o.filters), t0, dur, o.vol ?? 0.6, o.a ?? 0.03, o.r ?? 0.08);
  osc.start(t0); osc.stop(t0 + dur + 0.05);
}
function noise(o) {
  const t0 = ac.currentTime + (o.at || 0);
  const len = Math.max(1, Math.floor(ac.sampleRate * o.dur));
  const buf = ac.createBuffer(1, len, ac.sampleRate), d = buf.getChannelData(0);
  for (let i = 0; i < len; i++) d[i] = Math.random() * 2 - 1;
  const src = ac.createBufferSource(); src.buffer = buf;
  shape(chain(src, o.filters), t0, o.dur, o.vol ?? 0.4, o.a ?? 0.02, o.r ?? 0.1);
  src.start(t0); src.stop(t0 + o.dur + 0.05);
}

const SOUND = {
  cow() {
    tone({ pts: [[0, 140], [.35, 178], [.9, 150], [1.3, 105]], dur: 1.4, vib: [5, 6], filters: [['lowpass', 1100, 1], ['bandpass', 520, 2]], vol: 1.6, a: .12, r: .3 });
    tone({ type: 'sine', pts: [[0, 70], [1.3, 52]], dur: 1.4, vol: .4, a: .15, r: .3 });
  },
  dog() {
    [0, .3].forEach(at => {
      tone({ at, pts: [[0, 420], [.16, 220]], dur: .2, filters: [['lowpass', 1500, 1], ['bandpass', 900, 1.2]], vol: 1.8, a: .01, r: .08 });
      noise({ at, dur: .12, filters: [['bandpass', 1100, 1]], vol: .5, a: .005, r: .08 });
    });
  },
  cat() {
    tone({ pts: [[0, 420], [.18, 760], [.5, 820], [.85, 430]], dur: .9, vib: [6, 15], filters: [['bandpass', 1300, 2.5]], vol: 2, a: .12, r: .25 });
    tone({ type: 'sine', pts: [[0, 840], [.18, 1520], [.5, 1640], [.85, 860]], dur: .9, vol: .12, a: .12, r: .25 });
  },
  duck() {
    [0, .24, .48].forEach(at => tone({ at, pts: [[0, 620], [.18, 380]], dur: .2, vib: [70, 90], filters: [['bandpass', 1250, 4]], vol: 2.2, a: .01, r: .06 }));
  },
  sheep() {
    tone({ pts: [[0, 360], [.4, 330], [.85, 280]], dur: .9, vib: [14, 28], filters: [['bandpass', 1100, 4]], vol: 2.2, a: .06, r: .2 });
  },
  pig() {
    [0, .34].forEach(at => {
      tone({ at, pts: [[0, 180], [.07, 330], [.28, 170]], dur: .3, vib: [30, 25], filters: [['lowpass', 900, 1], ['bandpass', 600, 2]], vol: 2.2, a: .01, r: .1 });
      noise({ at, dur: .25, filters: [['bandpass', 500, 2]], vol: .35, a: .02, r: .15 });
    });
  },
  horse() {
    tone({ pts: [[0, 520], [.18, 1050], [.5, 900], [1.15, 340]], dur: 1.2, vib: [11, 45], filters: [['bandpass', 1600, 2]], vol: 2.2, a: .08, r: .3 });
    noise({ dur: 1.1, filters: [['bandpass', 2200, 1.5]], vol: .22, a: .1, r: .4 });
  },
  lion() {
    noise({ dur: 1.7, filters: [['lowpass', 900, 1], ['bandpass', 350, .8]], vol: 2.2, a: .15, r: .5 });
    tone({ pts: [[0, 95], [.4, 110], [1.7, 60]], dur: 1.7, vib: [28, 18], filters: [['lowpass', 600, 1]], vol: 1.4, a: .15, r: .5 });
  },
  elephant() {
    tone({ pts: [[0, 260], [.25, 880], [.8, 760], [1.2, 420]], dur: 1.25, vib: [9, 30], filters: [['bandpass', 1500, 2]], vol: 2.2, a: .06, r: .3 });
    noise({ dur: 1.1, filters: [['bandpass', 2600, 1]], vol: .2, a: .1, r: .4 });
  },
  frog() {
    [0, .16, .5, .66].forEach((at, i) => tone({
      at, type: 'square', pts: [[0, i % 2 ? 260 : 170], [.12, i % 2 ? 200 : 300]], dur: .14, vib: [45, 40],
      filters: [['lowpass', 900, 1], ['bandpass', 420, 3]], vol: 2.2, a: .01, r: .05
    }));
  }
};

// ---------- parent corner (press and hold the little house) ----------
const panel = document.getElementById('panel');
const pb = document.getElementById('parent');
let holdT = null;
pb.addEventListener('pointerdown', () => { holdT = setTimeout(() => panel.classList.add('open'), 700); });
['pointerup', 'pointerleave', 'pointercancel'].forEach(ev => pb.addEventListener(ev, () => clearTimeout(holdT)));
document.getElementById('closeBtn').onclick = () => panel.classList.remove('open');
document.getElementById('homeBtn').onclick = () => { location.href = 'index.html'; };

// ---------- deck ----------
const deck = document.getElementById('deck');
const dotsEl = document.getElementById('dots');
animals.forEach((a, i) => {
  const s = document.createElement('section');
  s.className = 'slide'; s.style.background = a.bg;
  s.innerHTML = `<div class="sun"></div><div class="hill"></div>
    <div class="animal" role="button" aria-label="${a.name}: tap to hear it">
      ${FACE[a.key]}<div class="bubble">${a.say}</div></div>
    <h1 class="name">${a.name}</h1>
    ${i === 0 ? '<div class="hint" aria-hidden="true">&#10140;</div>' : ''}`;
  deck.appendChild(s);
  dotsEl.appendChild(document.createElement('i'));

  const an = s.querySelector('.animal'), bub = s.querySelector('.bubble');
  an.addEventListener('click', () => {
    try { audio(); SOUND[a.key](); } catch (e) {}
    an.classList.remove('wiggle'); void an.offsetWidth; an.classList.add('wiggle');
    bub.classList.remove('show'); void bub.offsetWidth; bub.classList.add('show');
  });
  an.addEventListener('animationend', e => { if (e.animationName === 'wiggle') an.classList.remove('wiggle'); });
});
const slides = [...deck.children], dots = [...dotsEl.children];
let current = -1;
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    const i = slides.indexOf(en.target);
    if (en.isIntersecting && en.intersectionRatio > 0.6 && i !== current) {
      current = i;
      dots.forEach((d, k) => d.classList.toggle('on', k === i));
      slides.forEach(s => s.classList.remove('enter'));
      void en.target.offsetWidth;
      en.target.classList.add('enter');
      const h = deck.querySelector('.hint'); if (h && i > 0) h.remove();
    }
  });
}, { root: deck, threshold: [0.6] });
slides.forEach(s => io.observe(s));
if ('serviceWorker' in navigator) { window.addEventListener('load', () => navigator.serviceWorker.register('sw.js').catch(() => {})); }
</script>
</body>
</html>
