<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Animals</title>
<meta name="theme-color" content="#8fd3ff">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Toddler Games">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" href="icons/icon-192.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
<style>
  :root {
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    --ink: #2b2b3a;
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); }
  *, *::before, *::after { box-sizing: inherit; }
  html, body { height: 100%; margin: 0; background: #c9ecff; overflow: hidden; }
  body {
    font-family: "Baloo 2", ui-rounded, "Arial Rounded MT Bold", "Trebuchet MS", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none;
  }
  .deck {
    display: flex; height: 100%; overflow-x: auto; overflow-y: hidden;
    scroll-snap-type: x mandatory; scrollbar-width: none; -webkit-overflow-scrolling: touch; scroll-behavior: smooth;
  }
  .deck::-webkit-scrollbar { display: none; }
  .slide {
    flex: 0 0 100%; height: 100%; scroll-snap-align: center; scroll-snap-stop: always;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; overflow: hidden;
  }
  .sun { position: absolute; top: 9%; right: 8%; width: 16vmin; height: 16vmin; border-radius: 50%; background: rgba(255,255,255,.6); }
  .hill {
    position: absolute; left: -15%; right: -15%; bottom: -14%; height: 36%;
    border-radius: 50% 50% 0 0; background: #7fd07a;
  }
  .hill::after {
    content: ""; position: absolute; left: 0; right: 0; top: 0; bottom: 0; border-radius: inherit;
    background: radial-gradient(ellipse at 30% 0%, rgba(255,255,255,.25), transparent 60%);
  }
  .animal { position: relative; z-index: 2; width: min(80vw, 54vh); margin-top: 4vh; cursor: pointer; }
  .animal svg { width: 100%; height: auto; display: block; overflow: visible; }
  .slide.enter .animal { animation: pop .5s cubic-bezier(.2,.9,.3,1.3) both; }
  .animal.wiggle { animation: wiggle .6s ease; }
  @keyframes pop { from { transform: scale(.55) translateY(8vh); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes wiggle {
    0% { transform: rotate(0) scale(1); } 20% { transform: rotate(-5deg) scale(1.06); }
    45% { transform: rotate(5deg) scale(1.06); } 70% { transform: rotate(-3deg) scale(1.03); } 100% { transform: rotate(0) scale(1); }
  }
  .bubble {
    position: absolute; right: -6%; top: -6%; z-index: 5; background: #fff; color: var(--ink);
    font-weight: 800; font-size: clamp(26px, 8vw, 46px); line-height: 1; padding: 10px 18px; border-radius: 26px;
    box-shadow: 0 5px 0 rgba(0,0,0,.15); opacity: 0; transform: scale(.4); pointer-events: none; white-space: nowrap;
  }
  .bubble::after {
    content: ""; position: absolute; left: 22px; bottom: -12px; border: 10px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  .bubble.show { animation: bub 1.6s ease both; }
  @keyframes bub {
    0% { opacity: 0; transform: scale(.4) rotate(-6deg); } 15% { opacity: 1; transform: scale(1.1) rotate(3deg); }
    30% { transform: scale(1) rotate(0); } 80% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(.9); }
  }
  .name {
    position: relative; z-index: 3; margin: 2vh 0 0; font-size: clamp(48px, 15vw, 100px); font-weight: 800; color: #fff;
    line-height: 1; text-shadow: 0 5px 0 rgba(0,0,0,.22); text-align: center;
  }
  .hint {
    position: absolute; right: 16px; top: 44%; z-index: 4; font-size: 54px; color: rgba(255,255,255,.95);
    text-shadow: 0 3px 0 rgba(0,0,0,.25); animation: nudge 1.2s ease-in-out infinite; pointer-events: none;
  }
  @keyframes nudge { 0%,100% { transform: translateX(0); } 50% { transform: translateX(10px); } }
  .dots {
    position: fixed; left: 0; right: 0; top: calc(env(safe-area-inset-top, 0px) + 12px); z-index: 10;
    display: flex; gap: 7px; justify-content: center; pointer-events: none;
  }
  .dots i { width: 9px; height: 9px; border-radius: 50%; background: rgba(255,255,255,.6); transition: transform .2s, background .2s; }
  .dots i.on { background: #fff; transform: scale(1.5); }
  @media (prefers-reduced-motion: reduce) {
    .slide.enter .animal, .hint { animation: none; }
  }
</style>
</head>
<body>
<div class="dots" id="dots"></div>
<main class="deck" id="deck"></main>

<script src="shared.js"></script>
<script>
TG.holdButton({ emoji: '🏠', side: 'left', label: 'Home (press and hold)', hint: 'Hold to go home', onDone: () => { location.href = 'index.html'; } });

// ---------- animal faces (viewBox 200 x 200) ----------
const S = '#2b2b3a';
function eye(x, y, r = 8) {
  return `<circle cx="${x}" cy="${y}" r="${r}" fill="#222"/><circle cx="${x + r * .35}" cy="${y - r * .35}" r="${r * .32}" fill="#fff"/>`;
}
function scallops(cx, cy, R, r, n, fill, stroke) {
  let s = '';
  for (let i = 0; i < n; i++) {
    const a = i * 2 * Math.PI / n;
    s += `<circle cx="${(cx + Math.cos(a) * R).toFixed(1)}" cy="${(cy + Math.sin(a) * R).toFixed(1)}" r="${r}" fill="${fill}" stroke="${stroke}" stroke-width="3"/>`;
  }
  return s;
}

const FACE = {

</svg>`,

  <circle cx="100" cy="100" r="62" fill="#ffd93b" stroke="#b88a00" stroke-width="3.5"/>
  <circle cx="58" cy="116" r="11" fill="#ffa987" opacity=".55"/><circle cx="142" cy="116" r="11" fill="#ffa987" opacity=".55"/>
  ${eye(74, 84, 8)}${eye(126, 84, 8)}

  <path d="M58 128 Q100 146 142 128" stroke="#b35c00" stroke-width="3" fill="none" stroke-linecap="round"/>

sheep: `<svg viewBox="0 0 200 200">
  ${scallops(100, 98, 58, 26, 12, '#fff', '#cfd4dc')}
  <circle cx="100" cy="98" r="56" fill="#fff"/>
  <ellipse cx="60" cy="102" rx="16" ry="8" transform="rotate(25 60 102)" fill="#3a3a46"/>
  <ellipse cx="140" cy="102" rx="16" ry="8" transform="rotate(-25 140 102)" fill="#3a3a46"/>
  <ellipse cx="100" cy="116" rx="34" ry="44" fill="#3a3a46" stroke="#1d1d26" stroke-width="3"/>
  <circle cx="84" cy="70" r="15" fill="#fff" stroke="#cfd4dc" stroke-width="3"/><circle cx="116" cy="70" r="15" fill="#fff" stroke="#cfd4dc" stroke-width="3"/><circle cx="100" cy="64" r="17" fill="#fff" stroke="#cfd4dc" stroke-width="3"/>
  <circle cx="86" cy="104" r="9" fill="#fff"/>${eye(86, 105, 5.5)}
  <circle cx="114" cy="104" r="9" fill="#fff"/>${eye(114, 105, 5.5)}
  <ellipse cx="100" cy="138" rx="11" ry="7" fill="#ff9bb0"/>
  <path d="M100 145 Q92 152 86 148 M100 145 Q108 152 114 148" stroke="#ff9bb0" stroke-width="2.5" fill="none" stroke-linecap="round"/>
</svg>`,
pig: `<svg viewBox="0 0 200 200">
  <path d="M46 66 L28 26 L82 44Z" fill="#ff9fb5" stroke="#b04a68" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M154 66 L172 26 L118 44Z" fill="#ff9fb5" stroke="#b04a68" stroke-width="3.5" stroke-linejoin="round"/>
  <ellipse cx="100" cy="106" rx="62" ry="56" fill="#ffb3c6" stroke="#b04a68" stroke-width="3.5"/>
  <circle cx="48" cy="118" r="11" fill="#ff8fab" opacity=".55"/><circle cx="152" cy="118" r="11" fill="#ff8fab" opacity=".55"/>
  ${eye(72, 90, 7.5)}${eye(128, 90, 7.5)}
  <ellipse cx="100" cy="124" rx="33" ry="24" fill="#ff8fab" stroke="#b04a68" stroke-width="3.5"/>
  <ellipse cx="89" cy="124" rx="5" ry="9" fill="#b04a68"/><ellipse cx="111" cy="124" rx="5" ry="9" fill="#b04a68"/>
  <path d="M78 158 Q100 170 122 158" stroke="#b04a68" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>`,
horse: `<svg viewBox="0 0 200 200">
  <path d="M64 40 L54 6 L86 30Z" fill="#a8683a" stroke="#4a2a12" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M136 40 L146 6 L114 30Z" fill="#a8683a" stroke="#4a2a12" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M68 28 Q100 0 132 28 L130 74 Q100 54 70 74Z" fill="#3a2412"/>
  <path d="M62 40 Q100 20 138 40 Q152 82 136 132 Q134 184 100 188 Q66 184 64 132 Q48 82 62 40Z" fill="#b9763f" stroke="#4a2a12" stroke-width="3.5"/>
  <path d="M92 36 Q100 32 108 36 L106 122 Q100 128 94 122Z" fill="#fff" opacity=".9"/>
  <path d="M82 40 Q100 62 118 40 Q100 28 82 40Z" fill="#3a2412"/>
  <ellipse cx="100" cy="160" rx="29" ry="23" fill="#d9a77a" stroke="#4a2a12" stroke-width="3.5"/>
  <ellipse cx="90" cy="160" rx="4.5" ry="7" fill="#4a2a12"/><ellipse cx="110" cy="160" rx="4.5" ry="7" fill="#4a2a12"/>
  <path d="M86 177 Q100 184 114 177" stroke="#4a2a12" stroke-width="3" fill="none" stroke-linecap="round"/>
  ${eye(70, 88, 7.5)}${eye(130, 88, 7.5)}
</svg>`,
lion: `<svg viewBox="0 0 200 200">
  ${scallops(100, 104, 62, 22, 14, '#c26a1c', '#7a3d08')}
  <circle cx="100" cy="104" r="64" fill="#d98a2b" stroke="#7a3d08" stroke-width="3"/>
  <circle cx="60" cy="58" r="15" fill="#f2b15a" stroke="#7a3d08" stroke-width="3.5"/><circle cx="60" cy="58" r="7" fill="#ffb8c4"/>
  <circle cx="140" cy="58" r="15" fill="#f2b15a" stroke="#7a3d08" stroke-width="3.5"/><circle cx="140" cy="58" r="7" fill="#ffb8c4"/>
  <circle cx="100" cy="108" r="46" fill="#f6c36b" stroke="#7a3d08" stroke-width="3.5"/>
  ${eye(82, 98, 7)}${eye(118, 98, 7)}
  <ellipse cx="100" cy="126" rx="23" ry="16" fill="#fff1d0"/>
  <path d="M90 114 H110 L100 127Z" fill="#5a2d12" stroke="#5a2d12" stroke-width="2" stroke-linejoin="round"/>
  <path d="M100 127 V134 M100 134 Q90 146 80 139 M100 134 Q110 146 120 139" stroke="#5a2d12" stroke-width="3" fill="none" stroke-linecap="round"/>
</svg>`,
elephant: `<svg viewBox="0 0 200 200">
  <ellipse cx="36" cy="100" rx="34" ry="46" fill="#9aa7b8" stroke="#4b5666" stroke-width="3.5"/>
  <ellipse cx="42" cy="102" rx="19" ry="31" fill="#f0a7b5" opacity=".6"/>
  <ellipse cx="164" cy="100" rx="34" ry="46" fill="#9aa7b8" stroke="#4b5666" stroke-width="3.5"/>
  <ellipse cx="158" cy="102" rx="19" ry="31" fill="#f0a7b5" opacity=".6"/>
  <ellipse cx="100" cy="94" rx="52" ry="56" fill="#a9b6c8" stroke="#4b5666" stroke-width="3.5"/>
  <path d="M80 116 Q68 168 86 188 Q104 198 120 180 Q108 172 110 150 L120 116Z" fill="#a9b6c8" stroke="#4b5666" stroke-width="3.5" stroke-linejoin="round"/>
  <path d="M88 136 H108 M86 152 H106 M88 168 H104" stroke="#4b5666" stroke-width="2.5" stroke-linecap="round" opacity=".6"/>
  <path d="M76 132 Q58 154 74 168 Q70 152 84 140Z" fill="#fff" stroke="#8a8f99" stroke-width="2.5"/>
  <path d="M124 132 Q142 154 126 168 Q130 152 116 140Z" fill="#fff" stroke="#8a8f99" stroke-width="2.5"/>
  ${eye(78, 86, 7.5)}${eye(122, 86, 7.5)}
</svg>`,
frog: `<svg viewBox="0 0 200 200">
  <ellipse cx="100" cy="122" rx="68" ry="50" fill="#5fcf5a" stroke="#2c7a2a" stroke-width="3.5"/>
  <circle cx="64" cy="68" r="25" fill="#5fcf5a" stroke="#2c7a2a" stroke-width="3.5"/>
  <circle cx="136" cy="68" r="25" fill="#5fcf5a" stroke="#2c7a2a" stroke-width="3.5"/>
  <circle cx="64" cy="68" r="16" fill="#fff" stroke="#2c7a2a" stroke-width="2.5"/>${eye(66, 70, 8)}
  <circle cx="136" cy="68" r="16" fill="#fff" stroke="#2c7a2a" stroke-width="2.5"/>${eye(134, 70, 8)}
  <circle cx="92" cy="106" r="3.5" fill="#2c7a2a"/><circle cx="108" cy="106" r="3.5" fill="#2c7a2a"/>
  <circle cx="52" cy="128" r="10" fill="#ff9aa6" opacity=".55"/><circle cx="148" cy="128" r="10" fill="#ff9aa6" opacity=".55"/>
  <path d="M42 128 Q100 176 158 128" stroke="#2c7a2a" stroke-width="4.5" fill="none" stroke-linecap="round"/>
</svg>`
};

const animals = [
  { key: 'cow',      name: 'Cow',      say: 'Moo!',         bg: '#c9ecff', fx: ['🌼', '❤️', '🌿', '⭐'] },
  { key: 'dog',      name: 'Dog',      say: 'Woof woof!',   bg: '#ffe3a8', fx: ['🦴', '❤️', '⭐', '🐾'] },
  { key: 'cat',      name: 'Cat',      say: 'Meow!',        bg: '#e3d4ff', fx: ['🐟', '❤️', '⭐', '🐾'] },
  { key: 'duck',     name: 'Duck',     say: 'Quack quack!', bg: '#bff0d4', fx: ['💧', '🫧', '⭐', '🐥'] },
  { key: 'sheep',    name: 'Sheep',    say: 'Baa!',         bg: '#ffd0dc', fx: ['☁️', '❤️', '🌸', '⭐'] },
  { key: 'pig',      name: 'Pig',      say: 'Oink oink!',   bg: '#fff0b3', fx: ['🍎', '❤️', '🌽', '⭐'] },
  { key: 'horse',    name: 'Horse',    say: 'Neigh!',       bg: '#c7e0ff', fx: ['🥕', '🍎', '⭐', '❤️'] },
  { key: 'lion',     name: 'Lion',     say: 'Roar!',        bg: '#ffd9b0', fx: ['🔥', '⭐', '👑', '✨'] },
  { key: 'elephant', name: 'Elephant', say: 'Toot toot!',   bg: '#d4f0d0', fx: ['💦', '🥜', '⭐', '🎈'] },
  { key: 'frog',     name: 'Frog',     say: 'Ribbit!',      bg: '#ffe0ec', fx: ['🪰', '🫧', '💚', '⭐'] },
];
TG.preload(animals.map(a => a.key));

// ---------- tap reactions (each tap does the next one) ----------
const REACT = [
  el => el.animate([{ transform: 'translateY(0) scale(1,1)' }, { transform: 'translateY(0) scale(1.18,.82)', offset: .15 },
    { transform: 'translateY(-9vh) scale(.9,1.12)', offset: .5 }, { transform: 'translateY(0) scale(1.12,.88)', offset: .8 },
    { transform: 'translateY(0) scale(1,1)' }], { duration: 650, easing: 'ease-out' }),
  el => el.animate([{ transform: 'rotate(0)' }, { transform: 'rotate(-12deg) scale(1.1)' }, { transform: 'rotate(10deg) scale(1.1)' },
    { transform: 'rotate(-6deg) scale(1.05)' }, { transform: 'rotate(0)' }], { duration: 650, easing: 'ease-in-out' }),
  el => el.animate([{ transform: 'rotate(0) scale(1)' }, { transform: 'rotate(180deg) scale(1.2)' }, { transform: 'rotate(360deg) scale(1)' }],
    { duration: 750, easing: 'cubic-bezier(.3,.8,.4,1)' }),
  el => el.animate([{ transform: 'scale(1)' }, { transform: 'scale(1.3)', offset: .3 }, { transform: 'scale(.92)', offset: .6 }, { transform: 'scale(1)' }],
    { duration: 600, easing: 'ease-out' }),
];

// ---------- deck ----------
const deck = document.getElementById('deck');
const dotsEl = document.getElementById('dots');
animals.forEach((a, i) => {
  const s = document.createElement('section');
  s.className = 'slide'; s.style.background = a.bg;
  s.innerHTML = `<div class="sun"></div><div class="hill"></div>
    <div class="animal" role="button" aria-label="${a.name}: tap to hear it">
      ${FACE[a.key]}<div class="bubble">${a.say}</div></div>
    <h1 class="name">${a.name}</h1>
    ${i === 0 ? '<div class="hint" aria-hidden="true">&#10140;</div>' : ''}`;
  deck.appendChild(s);
  dotsEl.appendChild(document.createElement('i'));

  const an = s.querySelector('.animal'), bub = s.querySelector('.bubble');
  let taps = 0;
  an.addEventListener('pointerdown', e => {
    TG.play(a.key);
    REACT[taps++ % REACT.length](an);
    TG.pulse(an, 3);
    TG.burst(e.clientX, e.clientY, a.fx || ['❤️', '⭐', '🎵'], 9);
    bub.classList.remove('show'); void bub.offsetWidth; bub.classList.add('show');
  });
});
const slides = [...deck.children], dots = [...dotsEl.children];
let current = -1;
const io = new IntersectionObserver(entries => {
  entries.forEach(en => {
    const i = slides.indexOf(en.target);
    if (en.isIntersecting && en.intersectionRatio > 0.6 && i !== current) {
      current = i;
      dots.forEach((d, k) => d.classList.toggle('on', k === i));
      slides.forEach(s => s.classList.remove('enter'));
      void en.target.offsetWidth;
      en.target.classList.add('enter');
      const h = deck.querySelector('.hint'); if (h && i > 0) h.remove();
    }
  });
}, { root: deck, threshold: [0.6] });
slides.forEach(s => io.observe(s));
TG.registerSW();
</script>
</body>
</html>
